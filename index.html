<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBAC Vault - Secure API</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .vault-card {
      background-color: #lelele;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #333;
      box-sizing: border-box;
  }

    h2 {
      margin-top: 0;
      color: #4caf50;
      letter-spacing: 1px;
    }

    .hint-box {
      background: #2a2a2a;
      border-left: 3px solid #2196f3;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      text-align: left;
      color: #ddd;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #2c2c2c;
      color: white;
      box-sizing: border-box;
    }

    input:focus {
      outline:none;
      border-color: #4caf50;
    }

    #token-display {
      width:100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #lalala;
      color: #4caf50;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      word-wrap: break-word;
    }


    button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s;
    }
    

    .btn-primary { background-color: #4caf50; color: white; }
    .btn-primary:hover { background-color: #45a049; }

    .btn-public { background-color: #2196f3; color: white; }
    .btn-public:hover { background-color: #1976d2; }

    .btn-internal { background-color: #ff9800; color: white; }
    .btn-internal:hover { background-color: #da190b; }

    .btn-danger { background-color: #f44336; color: white; }
    .btn-danger:hover { background-color: #da190b; }

    .btn-logout { background-color: #555; color: white; }
    .btn-logout:hover { background-color: #444; }

    #message-box {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.9em;
      display: none; 
      word-wrap: break-word;
    }

    .success { background-color: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
    .error { background-color: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid #f44336; }


    #auth-section { display: block; }
    #vault-section { display: none; }


    @media (max-width: 480px) {
      .vault-card {
        padding: 20px;
      }

      h2 {
        font-size: 1.4rem;
      }

      .hint-box {
        font-size: 0.8rem;
        padding: 8px;
      }

      button {
        padding: 12px;
        font-size: 15px;
      }
      #token-display {
         font-size: 10px;
      }
    }
  </style>
</head>
<body>

<div class="vault-card">
  <h2> RBAC Document Vault</h2>

  <div id="auth-section">
    <div class="hint-box">
      <strong>Test Accounts (Password: password123)</strong><br>
      . <b>alice</b> (Role: Admin)<br>
      . <b>bob</b>   (Role: Employee)<br>
      . <b>charlie</b> (Role: Guest)
    </div>

    <div class="input-group">
      <input type"text" id="username" placeholder="Username" autocomplete="off">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button class="btn-primary" onclick="login()">Login to Vault</button>
  </div>

  


    
      









      
  
</body>
    

    
    
  </style>

  
</head>
