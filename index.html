<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBAC Vault - Secure API</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .vault-card {
      background-color: #lelele;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #333;
      box-sizing: border-box;
  }

    h2 {
      margin-top: 0;
      color: #4caf50;
      letter-spacing: 1px;
    }

    .hint-box {
      background: #2a2a2a;
      border-left: 3px solid #2196f3;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      text-align: left;
      color: #ddd;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #2c2c2c;
      color: white;
      box-sizing: border-box;
    }

    input:focus {
      outline:none;
      border-color: #4caf50;
    }

    #token-display {
      width:100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #lalala;
      color: #4caf50;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      word-wrap: break-word;
    }


    button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s;
    }

    

    
    
  </style>

  
</head>
